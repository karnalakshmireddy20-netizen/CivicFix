# ─────────────────────────────────────────────────────────────────────────────
# CivicFix — Spring Boot Configuration
# All sensitive values MUST be provided via environment variables.
# Copy .env.example to .env and fill in values for local development.
# NEVER commit real passwords or secrets to version control.
# ─────────────────────────────────────────────────────────────────────────────

# Server
server.port=${PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# DB_PASSWORD has NO default — must be set via environment variable
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicfix?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ─────────────────────────────────────────────────────────────────────
# JWT_SECRET has a non-production default — override in production
jwt.secret=${JWT_SECRET:civicfix-dev-secret-key-change-in-production-minimum-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── File Upload ─────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ─── CORS ────────────────────────────────────────────────────────────────────
# Set CORS_ORIGINS on Railway to include your Vercel frontend URL
# Example: https://your-app.vercel.app,http://localhost:5173
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.civicfix=INFO
logging.level.org.springframework.security=WARN
